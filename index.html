<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rick's Restorations | Handyman services in Anderson, IN/title>
<meta name="description" content="Rick's Restorations delivers dependable home improvement and repair services in Anderson, Indiana — electrical, drywall, painting, plumbing, tile, flooring, siding and more.">
<link rel="icon" href="https://ricksrestoration.com/wp-content/uploads/2025/11/Ricks-Restorations-Logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,560;0,9..144,650;1,9..144,450&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --ink:#1b1d21;
    --ink-soft:#24272c;
    --ink-line:#33363c;
    --parchment:#f6f1e7;
    --parchment-dim:#efe7d8;
    --paper:#fffdf8;
    --brass:#b8823e;
    --brass-deep:#8f6329;
    --brass-light:#d9a55c;
    --text-dark:#24211c;
    --text-muted:#726b60;
    --text-on-dark:#efe9dd;
    --text-on-dark-muted:#a9a49a;
    --line-light: rgba(36,33,28,0.12);
    --radius: 2px;
    --shadow-lg: 0 30px 60px -20px rgba(27,29,33,0.35);
    --shadow-sm: 0 10px 24px -12px rgba(27,29,33,0.25);
    --maxw: 1220px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--text-dark);
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces',serif;
    font-weight:560;
    letter-spacing:-0.01em;
    color:var(--text-dark);
    margin:0 0 .5em;
  }
  h1{font-weight:450;}
  p{margin:0 0 1em;color:var(--text-muted);}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  ul{margin:0;padding:0;list-style:none;}
  button{font-family:inherit;cursor:pointer;}

  /* brass selection instead of default blue */
  ::selection{ background:var(--brass); color:#fff; }
  ::-moz-selection{ background:var(--brass); color:#fff; }

  :focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
  .eyebrow{
    display:flex;align-items:center;gap:10px;
    font-family:'Inter',sans-serif;
    font-size:12.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--brass-deep); font-weight:700; margin-bottom:14px;
  }
  .eyebrow::before{content:"";width:26px;height:2px;background:var(--brass);display:inline-block;}
  .eyebrow.on-dark{color:var(--brass-light);}

  .btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 26px; font-weight:700; font-size:14.5px;
    border-radius:var(--radius); border:1px solid transparent;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
    white-space:nowrap;
  }
  .btn-brass{ background:var(--brass); color:#fff; box-shadow:var(--shadow-sm); }
  .btn-brass:hover{ background:var(--brass-deep); transform:translateY(-2px); }
  .btn-outline{ border-color:rgba(255,255,255,.4); color:#fff; }
  .btn-outline:hover{ background:rgba(255,255,255,.1); transform:translateY(-2px); }
  .btn-outline-dark{ border-color:var(--line-light); color:var(--text-dark); }
  .btn-outline-dark:hover{ background:var(--text-dark); color:#fff; }
  .btn-sm{padding:10px 18px;font-size:13px;}

  /* ============ HEADER ============ */
  header{
    position:sticky; top:0; z-index:900;
    background:rgba(27,29,33,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .nav-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 28px; gap:24px;}
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand img{ height:54px; width:auto; object-fit:contain; border-radius:3px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text .name{ font-family:'Fraunces',serif; font-size:19px; color:#fff; font-weight:560; letter-spacing:.01em;}
  .brand-text .tag{ font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--brass-light); font-weight:700; margin-top:3px;}

  nav.primary-nav{ display:flex; align-items:center; gap:36px; }
  nav.primary-nav a{
    color:var(--text-on-dark-muted); font-size:14.5px; font-weight:600;
    position:relative; padding:6px 0;
    transition:color .15s ease;
  }
  nav.primary-nav a:hover, nav.primary-nav a.active{ color:#fff; }
  nav.primary-nav a::after{
    content:""; position:absolute; left:0; bottom:0; height:2px; width:0;
    background:var(--brass-light); transition:width .2s ease;
  }
  nav.primary-nav a:hover::after{ width:100%; }

  .header-actions{ display:flex; align-items:center; gap:14px; }
  .phone-pill{
    display:flex; align-items:center; gap:8px;
    color:#fff; font-weight:700; font-size:14px;
    border:1px solid rgba(255,255,255,.25); padding:9px 16px; border-radius:var(--radius);
  }
  .phone-pill:hover{ border-color:var(--brass-light); color:var(--brass-light); }

  .burger{ display:none; background:none; border:0; width:34px; height:34px; position:relative; }
  .burger span, .burger span::before, .burger span::after{
    content:""; position:absolute; left:6px; right:6px; height:2px; background:#fff; transition:.2s;
  }
  .burger span{ top:16px; }
  .burger span::before{ top:-8px; }
  .burger span::after{ top:8px; }
  .burger.open span{ background:transparent; }
  .burger.open span::before{ transform:rotate(45deg); top:0; }
  .burger.open span::after{ transform:rotate(-45deg); top:0; }

  #mobileNav{
    display:none; flex-direction:column; gap:2px; padding:8px 28px 20px;
    background:rgba(27,29,33,.98);
  }
  #mobileNav.open{ display:flex; }
  #mobileNav a{ color:var(--text-on-dark-muted); padding:12px 0; border-bottom:1px solid rgba(255,255,255,.08); font-weight:600; }
  #mobileNav a:hover{ color:#fff; }

  @media (max-width:980px){
    nav.primary-nav{ display:none; }
    .header-actions .phone-pill span.label{ display:none; }
    .burger{ display:block; }
  }

  /* ============ HERO ============ */
  .hero{
    position:relative; color:#fff; overflow:hidden;
    background:var(--ink);
    min-height:88vh; display:flex; align-items:center;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(100deg, rgba(20,21,24,.94) 8%, rgba(20,21,24,.72) 42%, rgba(20,21,24,.35) 68%, rgba(20,21,24,.15) 100%),
      url('https://ricksrestoration.com/wp-content/uploads/2025/11/153534695017-1024x768.jpg') center/cover no-repeat;
  }
  .hero-inner{ position:relative; z-index:2; padding:120px 0 90px; }
  .hero h1{
    color:#fff; font-size:clamp(38px,5.6vw,68px); line-height:1.04; max-width:820px;
    font-weight:450;
  }
  .hero h1 em{ font-style:italic; color:var(--brass-light); font-weight:450;}
  .hero p.lead{ color:var(--text-on-dark-muted); font-size:18px; max-width:560px; margin-bottom:34px;}
  .hero-ctas{ display:flex; align-items:center; flex-wrap:wrap; gap:18px; }
  .hero-ctas .phone-inline{ font-weight:700; font-size:16px; display:flex; align-items:center; gap:10px;}
  .hero-ctas .phone-inline .dot{ width:8px;height:8px;border-radius:50%;background:var(--brass-light); box-shadow:0 0 0 5px rgba(217,165,92,.18);}

  .hero-stats{
    position:relative; z-index:2;
    display:flex; gap:0; margin-top:74px; border-top:1px solid rgba(255,255,255,.16);
    max-width:820px;
  }
  .hero-stats div{ padding:22px 34px 0 0; margin-right:34px; border-right:1px solid rgba(255,255,255,.14); }
  .hero-stats div:last-child{ border-right:none; }
  .hero-stats .num{ font-family:'Fraunces',serif; font-size:30px; color:var(--brass-light); }
  .hero-stats .lbl{ font-size:12.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-on-dark-muted); margin-top:2px;}

  /* ============ SECTION SHELLS ============ */
  section{ padding:104px 0; }
  .section-light{ background:var(--parchment); }
  .section-paper{ background:var(--paper); }
  .section-dark{ background:var(--ink); color:var(--text-on-dark); }
  .section-dark h2, .section-dark h3, .section-dark h4{ color:#fff; }
  .section-dark p{ color:var(--text-on-dark-muted); }
  .section-head{ max-width:660px; margin-bottom:56px; }
  .section-head h2{ font-size:clamp(28px,3.4vw,42px); }
  .measure-rule{
    height:14px; margin:0 0 40px;
    background-image: repeating-linear-gradient(to right, var(--brass) 0 1px, transparent 1px 14px);
    background-position:bottom; background-repeat:repeat-x; background-size:auto 14px;
    opacity:.55;
  }

  /* ============ ABOUT ============ */
  .about-grid{ display:grid; grid-template-columns:1fr 1fr; gap:74px; align-items:center; }
  .about-media{ position:relative; }
  .about-media img{ width:100%; height:520px; object-fit:cover; border-radius:3px; box-shadow:var(--shadow-lg);}
  .about-media .badge{
    position:absolute; left:-26px; bottom:-26px; background:var(--brass); color:#fff;
    padding:22px 26px; border-radius:3px; box-shadow:var(--shadow-sm);
    font-family:'Fraunces',serif;
  }
  .about-media .badge .n{ font-size:34px; line-height:1; }
  .about-media .badge .l{ font-family:'Inter',sans-serif; font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-top:4px;}
  .about-points{ display:grid; grid-template-columns:1fr 1fr; gap:14px 22px; margin:26px 0 32px; }
  .about-points li{ display:flex; gap:10px; align-items:flex-start; font-size:14.5px; color:var(--text-dark); font-weight:600;}
  .about-points li::before{ content:"✓"; color:var(--brass); font-weight:800; flex:none; }

  @media (max-width:920px){
    .about-grid{ grid-template-columns:1fr; }
    .about-media img{ height:360px; }
    .about-points{ grid-template-columns:1fr; }
  }

  /* ============ WHY CHOOSE ============ */
  .why-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; background:var(--ink-line); border:1px solid var(--ink-line); }
  .why-card{ background:var(--ink); padding:44px 38px; }
  .why-card .idx{ font-family:'Fraunces',serif; font-style:italic; color:var(--brass-light); font-size:15px; margin-bottom:18px; display:block;}
  .why-card h3{ font-size:21px; margin-bottom:12px; }
  @media (max-width:860px){ .why-grid{ grid-template-columns:1fr; } }

  /* ============ SERVICES ============ */
  .services-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:56px;}
  .svc-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
  .svc-card{
    background:var(--paper); border:1px solid var(--line-light); border-radius:3px; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .2s ease, box-shadow .2s ease;
  }
  .svc-card:hover{ transform:translateY(-6px); box-shadow:var(--shadow-lg); }
  .svc-media{ position:relative; height:216px; overflow:hidden; }
  .svc-media img{ width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
  .svc-card:hover .svc-media img{ transform:scale(1.07); }
  .svc-media .svc-num{
    position:absolute; top:14px; left:14px; background:rgba(27,29,33,.72); color:var(--brass-light);
    font-family:'Fraunces',serif; font-style:italic; font-size:13px; padding:5px 11px; border-radius:2px;
  }
  .svc-body{ padding:24px 26px 26px; display:flex; flex-direction:column; flex:1; }
  .svc-body h3{ font-size:20px; margin-bottom:10px; }
  .svc-body p{ font-size:14.5px; flex:1; margin-bottom:18px; }
  .svc-actions{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .svc-link{ font-size:13.5px; font-weight:700; color:var(--brass-deep); display:flex; align-items:center; gap:6px; }
  .svc-link:hover{ color:var(--brass); }
  .svc-link .arrow{ transition:transform .15s ease; }
  .svc-link:hover .arrow{ transform:translateX(4px); }

  @media (max-width:980px){ .svc-grid{ grid-template-columns:1fr 1fr; } }
  @media (max-width:640px){ .svc-grid{ grid-template-columns:1fr; } }

  .explore-cta{ margin-top:56px; display:flex; justify-content:center; }

  /* ============ SERVICE DETAIL OVERLAY (acts as its own page) ============ */
  .svc-detail{
    position:fixed; inset:0; z-index:1200; background:var(--parchment);
    overflow-y:auto; transform:translateY(24px); opacity:0; pointer-events:none;
    transition:opacity .28s ease, transform .28s ease;
  }
  .svc-detail.open{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .svc-detail-bar{
    position:sticky; top:0; z-index:5; background:rgba(27,29,33,.95); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
  }
  .svc-detail-bar .back{ color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
  .svc-detail-bar .back:hover{ color:var(--brass-light); }
  .svc-hero{ position:relative; height:46vh; min-height:320px; }
  .svc-hero img{ width:100%; height:100%; object-fit:cover; }
  .svc-hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(27,29,33,.85), rgba(27,29,33,.05) 60%); }
  .svc-hero .svc-hero-caption{ position:absolute; left:0; right:0; bottom:0; padding:40px 28px; max-width:var(--maxw); margin:0 auto; }
  .svc-hero .svc-hero-caption h2{ color:#fff; font-size:clamp(28px,4vw,46px); margin-bottom:6px; }
  .svc-detail-body{ padding:64px 0 100px; }
  .svc-detail-grid{ display:grid; grid-template-columns:1.5fr 1fr; gap:60px; }
  .svc-detail-grid h4{ font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--brass-deep); margin-bottom:16px;}
  .svc-includes{ display:grid; gap:12px; margin-bottom:28px;}
  .svc-includes li{ display:flex; gap:10px; font-size:15px; color:var(--text-dark); font-weight:500; }
  .svc-includes li::before{ content:"—"; color:var(--brass); font-weight:800; }
  .svc-side{ background:var(--paper); border:1px solid var(--line-light); border-radius:3px; padding:30px; align-self:start; }
  .svc-side .row{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line-light); font-size:14px; }
  .svc-side .row:last-of-type{ border-bottom:none; }
  .svc-side .row span:first-child{ color:var(--text-muted); }
  .svc-side .row span:last-child{ font-weight:700; }
  @media (max-width:860px){ .svc-detail-grid{ grid-template-columns:1fr; } }

  /* ============ PROCESS ============ */
  .process-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; position:relative; }
  .process-grid::before{
    content:""; position:absolute; top:26px; left:6%; right:6%; height:1px;
    background:repeating-linear-gradient(to right, var(--ink-line) 0 8px, transparent 8px 16px);
  }
  .process-step{ position:relative; padding-right:26px; }
  .process-num{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--brass);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-style:italic;
    color:var(--brass-light); background:var(--ink); font-size:19px; margin-bottom:22px; position:relative; z-index:1;
  }
  .process-step h3{ font-size:18px; margin-bottom:8px; }
  .process-step p{ font-size:14px; }
  @media (max-width:900px){ .process-grid{ grid-template-columns:1fr 1fr; row-gap:40px;} .process-grid::before{ display:none; } }
  @media (max-width:560px){ .process-grid{ grid-template-columns:1fr; } }

  /* ============ GALLERY ============ */
  .gallery-grid{ display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:130px; gap:10px; }
  .gallery-grid a{ overflow:hidden; border-radius:2px; position:relative; display:block; }
  .gallery-grid img{ width:100%; height:100%; object-fit:cover; transition:transform .5s ease, filter .3s ease; }
  .gallery-grid a:hover img{ transform:scale(1.08); }
  .g1{ grid-column:span 2; grid-row:span 2; }
  .g2{ grid-column:span 2; grid-row:span 1; }
  .g3{ grid-column:span 2; grid-row:span 1; }
  .g4{ grid-column:span 2; grid-row:span 2; }
  .g5{ grid-column:span 2; grid-row:span 1; }
  .g6{ grid-column:span 2; grid-row:span 1; }
  @media (max-width:760px){
    .gallery-grid{ grid-template-columns:repeat(2,1fr); grid-auto-rows:170px; }
    .g1,.g2,.g3,.g4,.g5,.g6{ grid-column:span 1; grid-row:span 1; }
  }

  /* ============ TESTIMONIALS ============ */
  .testi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:26px; }
  .testi-card{ background:var(--ink-soft); border:1px solid var(--ink-line); border-radius:3px; padding:34px; }
  .testi-stars{ color:var(--brass-light); letter-spacing:3px; margin-bottom:16px; font-size:15px; }
  .testi-card p{ color:var(--text-on-dark); font-size:16px; font-family:'Fraunces',serif; font-style:italic; line-height:1.5; }
  .testi-name{ margin-top:18px; font-size:13px; color:var(--brass-light); font-weight:700; text-transform:uppercase; letter-spacing:.06em; font-family:'Inter',sans-serif; font-style:normal; }
  @media (max-width:760px){ .testi-grid{ grid-template-columns:1fr; } }

  /* ============ FAQ ============ */
  .faq-list{ max-width:800px; }
  .faq-item{ border-bottom:1px solid var(--line-light); }
  .faq-q{
    width:100%; background:none; border:0; text-align:left; padding:24px 0;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    font-family:'Fraunces',serif; font-size:19px; color:var(--text-dark);
  }
  .faq-q .plus{ font-size:22px; color:var(--brass); transition:transform .2s ease; flex:none; }
  .faq-item.open .plus{ transform:rotate(45deg); }
  .faq-a{ max-height:0; overflow:hidden; transition:max-height .28s ease; }
  .faq-a p{ padding-bottom:22px; margin:0; max-width:640px; }

  /* ============ AREAS ============ */
  .areas-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  .area-card{
    position:relative; height:260px; border-radius:3px; overflow:hidden; display:flex; align-items:flex-end;
    padding:26px; color:#fff; background:var(--ink);
  }
  .area-card::before{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(27,29,33,.15), rgba(27,29,33,.9)); }
  .area-card .icon{ position:absolute; top:22px; left:22px; width:36px; height:36px; border:1px solid var(--brass-light); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--brass-light); font-size:15px; z-index:1;}
  .area-card .content{ position:relative; z-index:1; }
  .area-card h3{ color:#fff; font-size:22px; margin-bottom:4px; }
  .area-card span{ font-size:13px; color:var(--text-on-dark-muted); }
  @media (max-width:860px){ .areas-grid{ grid-template-columns:1fr; } }

  /* ============ CONTACT ============ */
  .contact-grid{ display:grid; grid-template-columns:.9fr 1.1fr; gap:70px; }
  .contact-list{ display:grid; gap:22px; margin-top:30px; }
  .contact-row{ display:flex; gap:16px; align-items:flex-start; }
  .contact-row .ic{
    width:44px; height:44px; border-radius:50%; background:var(--brass); color:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .contact-row h4{ font-size:15px; margin-bottom:3px; }
  .contact-row p{ margin:0; font-size:14.5px; }
  .contact-form{ background:var(--paper); border:1px solid var(--line-light); padding:36px; border-radius:3px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .form-grid .full{ grid-column:1/-1; }
  label{ display:block; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px; }
  input, textarea{
    width:100%; border:1px solid var(--line-light); background:var(--parchment); padding:13px 14px; border-radius:2px;
    font-family:inherit; font-size:14.5px; color:var(--text-dark);
  }
  input:focus, textarea:focus{ border-color:var(--brass); background:#fff; }
  textarea{ resize:vertical; min-height:120px; }
  .form-grid > div{ margin-bottom:4px; }
  @media (max-width:920px){ .contact-grid{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .form-grid{ grid-template-columns:1fr; } }

  /* ============ FOOTER ============ */
  footer{ background:#141518; color:var(--text-on-dark-muted); padding:80px 0 0; }
  .footer-grid{ display:grid; grid-template-columns:1.3fr 1fr 1fr 1.2fr; gap:50px; padding-bottom:60px; border-bottom:1px solid rgba(255,255,255,.08); }
  .footer-brand img{ height:64px; width:auto; object-fit:contain; margin-bottom:18px; }
  .footer-brand p{ font-size:14px; max-width:280px; }

  li.innerHTML = '<a href="#service/'+s.slug+'" data-slug="'+s.slug+'">'+s.title+'</a>';
  footerList.appendChild(li);
});
var allLi = document.createElement('li');
allLi.innerHTML = '<a href="#services">All Services</a>';
footerList.appendChild(allLi);

/* ================= SERVICE DETAIL "PAGE" (hash-routed overlay) ================= */
var detailEl = document.getElementById('svcDetail');
function openService(slug){
  var s = services.find(function(x){ return x.slug === slug; });
  if(!s) return;
  document.getElementById('svcDetailImg').src = s.img;
  document.getElementById('svcDetailImg').alt = s.title;
  document.getElementById('svcDetailTitle').innerHTML = s.title;
  document.getElementById('svcDetailEyebrow').textContent = 'Rick\'s Restorations · Service';
  document.getElementById('svcDetailDesc').textContent = s.short;
  document.getElementById('svcSideName').textContent = s.title;
  var incWrap = document.getElementById('svcDetailIncludes');
  incWrap.innerHTML = '';
  s.includes.forEach(function(item){
    var li = document.createElement('li');
    li.textContent = item;
    incWrap.appendChild(li);
  });
  detailEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  window.scrollTo(0,0);
}
function closeService(){
  detailEl.classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('click', function(e){
  var link = e.target.closest('[data-slug]');
  if(link){
    e.preventDefault();
    var slug = link.getAttribute('data-slug');
    window.location.hash = 'service/' + slug;
  }
});
document.getElementById('svcBack').addEventListener('click', function(e){
  e.preventDefault();
  window.location.hash = 'services';
});

function routeFromHash(){
  var hash = window.location.hash.replace('#','');
  if(hash.indexOf('service/') === 0){
    openService(hash.replace('service/',''));
  } else {
    closeService();
  }
}
window.addEventListener('hashchange', routeFromHash);
routeFromHash();

/* ================= FAQ ACCORDION ================= */
var faqList = document.getElementById('faqList');
faqs.forEach(function(f){
  var item = document.createElement('div');
  item.className = 'faq-item';
  item.innerHTML =
    '<button class="faq-q"><span>'+f.q+'</span><span class="plus">+</span></button>' +
    '<div class="faq-a"><p>'+f.a+'</p></div>';
  faqList.appendChild(item);
});
faqList.addEventListener('click', function(e){
  var btn = e.target.closest('.faq-q');
  if(!btn) return;
  var item = btn.parentElement;
  var answer = item.querySelector('.faq-a');
  var wasOpen = item.classList.contains('open');
  faqList.querySelectorAll('.faq-item.open').forEach(function(i){
    i.classList.remove('open');
    i.querySelector('.faq-a').style.maxHeight = null;
  });
  if(!wasOpen){
    item.classList.add('open');
    answer.style.maxHeight = answer.scrollHeight + 'px';
  }
});

/* ================= MOBILE NAV ================= */
var burger = document.getElementById('burgerBtn');
var mobileNav = document.getElementById('mobileNav');
burger.addEventListener('click', function(){
  var open = mobileNav.classList.toggle('open');
  burger.classList.toggle('open', open);
  burger.setAttribute('aria-expanded', open);
});
mobileNav.querySelectorAll('a').forEach(function(a){
  a.addEventListener('click', function(){
    mobileNav.classList.remove('open');
    burger.classList.remove('open');
  });
});

/* ================= ACTIVE NAV HIGHLIGHT ================= */
var navLinks = document.querySelectorAll('nav.primary-nav a');
var navSections = ['home','about','services','contact'].map(function(id){ return document.getElementById(id); });
window.addEventListener('scroll', function(){
  var pos = window.scrollY + 140;
  var current = 'home';
  navSections.forEach(function(sec){
    if(sec && sec.offsetTop <= pos) current = sec.id;
  });
  navLinks.forEach(function(a){
    a.classList.toggle('active', a.getAttribute('href') === '#'+current);
  });
});
</script>
</body>
</html>
